<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 760" role="img">
  <rect width="520" height="760" fill="#f4f1ea"/>
  <text x="260" y="32" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#3d3429">Nicho 0,75 × 2,00 m — Brastemp 70,4 × 194,4 cm</text>
  <text x="260" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#6b6156">escala 3 px = 1 cm · vista de frente</text>

  <!-- niche outline 75 x 200 cm -->
  <rect x="147.5" y="80" width="225" height="600" fill="none" stroke="#3d3429" stroke-width="2"/>
  <text x="260" y="74" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#3d3429">vão 75 × 200 cm</text>

  <!-- side gaps 2.3 cm each = 6.9 px -->
  <rect x="147.5" y="96.8" width="6.9" height="583.2" fill="#e6f0e8"/>
  <rect x="365.6" y="96.8" width="6.9" height="583.2" fill="#e6f0e8"/>
  <!-- top gap 5.6 cm = 16.8 px -->
  <rect x="147.5" y="80" width="225" height="16.8" fill="#e8d4b8"/>

  <!-- fridge 70.4 x 194.4 -->
  <rect x="154.4" y="96.8" width="211.2" height="583.2" fill="#c9c4bb" stroke="#5c4033" stroke-width="1.5"/>
  <line x1="154.4" y1="477" x2="365.6" y2="477" stroke="#5c4033" stroke-width="1.2"/>
  <text x="260" y="300" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#3d3429" font-weight="600">refrigerador</text>
  <text x="260" y="320" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#6b6156">326 L · LED</text>
  <text x="260" y="545" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#3d3429" font-weight="600">freezer</text>
  <text x="260" y="563" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#6b6156">174 L · LED</text>

  <text x="132" y="400" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#2c5a3d" transform="rotate(-90 132 400)">2,3 cm</text>
  <text x="388" y="400" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#2c5a3d" transform="rotate(90 388 400)">2,3 cm</text>
  <text x="260" y="92" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8a5a2b">5,6 cm no topo</text>

  <text x="260" y="708" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#3d3429">70,4 cm de largura · 194,4 cm de altura</text>
  <text x="260" y="728" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#6b6156">Guia Brastemp pede 10 cm laterais, traseira e topo se embutir. No vão de 75 cm as laterais ficam 2,3 cm — só cabe se o nicho for aberto nas laterais.</text>
  <text x="260" y="748" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8a7a68">Única inverse bivolt inox desta faixa com LED confirmado no refrigerador e no freezer.</text>
</svg>
